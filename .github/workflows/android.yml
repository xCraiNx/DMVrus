name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup exact Flutter version required by Flet
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # ИСПРАВЛЕНО НА СТАБИЛЬНЫЙ 3.12

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4

      - name: Automatically Accept Android Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || echo "Licenses updated"

      - name: Disable Flutter Analytics & Build APK
        env:
          FLET_CI: "true"
          CI: "true"
        run: |
          flutter config --no-analytics
          run: flet build apk --python-version 3.12 --arch arm64-v8a --yes --verbose
          
      - name: Upgrade Flet CLI
        run: pip install --upgrade flet

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-trainer-app
          path: build/apk/*.apk
