name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet Dependency
        run: |
          pip install --upgrade pip
          pip install flet==1.0.4

      - name: Export Flet to Native Flutter Project
        run: |
          flet pack . --product "Trainer OT EB" --org org.trainer

      - name: Compile Native Android APK
        run: |
          cd build/flutter
          flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-trainer-app
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk
