name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          flet --version

      - name: Build APK
        env:
          CI: "true"
          FLET_CI: "true"
        run: |
          flet build apk --yes --verbose
          find build -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flet-trainer-apk
          path: build/**/*.apk
          if-no-files-found: error
