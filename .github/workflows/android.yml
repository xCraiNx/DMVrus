name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet CLI and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk lightdm
          pip install --upgrade pip
          pip install flet

      - name: Build Android APK
        run: |
          flet build apk main.py --product "Trainer OT EB" --org org.trainer
