name: Build Flet APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2'

      - name: Disable Flutter Analytics & Build APK
        env:
          FLET_CI: "true"
          CI: "true"
        run: |
          flutter config --no-analytics
          flet build apk --project "Trainer OT EB" --org org.trainer

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-trainer-app
          path: build/apk/*.apk
