name: Build Flet APK
on:
  workflow_dispatch: # Позволяет запускать сборку только вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lld apt-utils cmake
          sudo apt-get install -y openjdk-17-jdk signapk unzip zip
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flet-trainer-app
          path: bin/*.apk
